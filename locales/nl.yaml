      rewritten: "herschreven"
      patched: "gepatcht"
      written: "geschreven"
      removed: "verwijderd"
      deleted: "verwijderd"
    label:
      skill: "Skill"
      memory: "Geheugen"
      user: "Gebruikersprofiel"
    summary_cli: "  💾 Zelfverbeteringsreview: {summary}"
    summary_callback: "💾 Zelfverbeteringsreview: {summary}"
    aux_failure_label: "achtergrondreview"
  notice:
    uncompressed_context_overflow: "⚠️ Sessiecontext (~{tokens} tokens) is groter dan het contextvenster van het model (~{context_length} tokens) terwijl compressie is uitgeschakeld (compression.enabled: false). Gebruik /compact om de geschiedenis te comprimeren of schakel compressie in via config.yaml."
explainer:
  no_reply_prefix: "⚠️ Geen antwoord: "
  empty_response: "{model} gaf deze keer geen antwoord, ook niet na nieuwe pogingen. Stuur `continue` om het opnieuw te proberen, of wissel van model met /model."
  exit:
    all_retries_exhausted_no_response: "de modelaanbieder antwoordde niet na alle pogingen. Stuur /retry, of wissel van model met /model."
    partial_stream_recovery: "het streamen stopte te vroeg en er is maar een deel van het antwoord hersteld. Stuur `continue` om verder te gaan waar het stopte."
    fallback_prior_turn_content: "er is deze beurt geen nieuwe inhoud gemaakt; herstelde eerdere context wordt getoond. Stuur `continue` om het opnieuw te proberen."
    redirect_restart_limit_exceeded: "het verzoek werd bij elke poging geannuleerd door een nieuwe correctie, dus de beurt is gestopt in plaats van eindeloos opnieuw te proberen. Je laatste correctie staat in de wachtrij als volgend bericht."
    rebuilt_restart_limit_exceeded: "elke aanbieder in de fallbackketen bleef falen, dus de beurt is gestopt in plaats van eindeloos opnieuw te proberen. Stuur `continue` of wissel van aanbieder."
    budget_exhausted: "het iteratie-/kostenbudget per beurt was op voordat er een eindantwoord was. Stuur `continue` om door te gaan."
    ollama_runtime_context_too_small: "het contextvenster van het lokale model was te klein om af te ronden. Vergroot de contextgrootte of gebruik een groter model."
    pending_tool_result: "de beurt stopte terwijl een toolresultaat nog openstond en het model gaf geen vervolgtekst. Stuur `continue` om het te laten samenvatten."
    interrupted_during_api_call: "het verzoek werd tijdens de aanroep onderbroken voordat er een antwoord binnenkwam. Stuur `continue` om het opnieuw te proberen."
    max_iterations_reached: "de maximale limiet voor tooliteraties is bereikt voordat er een eindantwoord was. Stuur `continue` om door te gaan, of verhoog `max_iterations`."
    error_near_max_iterations: "er trad een fout op vlak bij de iteratielimiet, voordat er een eindantwoord was. Controleer de tooluitvoer hierboven en stuur dan `continue`."
    repeated_outer_errors: "de beurt bleef mislukken met herhaalde fouten en is vroegtijdig gestopt in plaats van eindeloos opnieuw te proberen. Controleer de fouten hierboven en stuur dan `continue` om het opnieuw te proberen."
  persistence:
    compression: "de beurt is gestopt omdat een ander proces deze sessie aan het comprimeren was. Je bericht zou al opgeslagen moeten zijn — stuur het opnieuw zodra de compressie klaar is."
    compression_closed: "de beurt is gestopt omdat deze sessie door contextcompressie is gewisseld en het lopende vervolg niet kon worden overgenomen. De opslag zelf is in orde — vernieuw de client (of start een nieuwe beurt) zodat die de nieuwe sessie-id oppikt, en stuur je bericht dan opnieuw."
    turn_lease: "de beurt is gestopt omdat een ander Hermes-proces deze sessie heeft overgenomen. Je antwoord is niet opgeslagen — wacht tot het andere proces klaar is en stuur je bericht dan opnieuw."
    session_row_missing: "deze sessie is uit de opslag verwijderd terwijl het gesprek nog openstond, en Hermes kon hem niet opnieuw aanmaken, dus dit bericht is niet opgeslagen. Stuur je bericht opnieuw; blijft het mislukken, voer dan `hermes {profile_arg}doctor` uit."
    locked: "de beurt is gestopt omdat de sessieopslag bezet was (een ander Hermes-proces schreef naar de statusdatabase). Je bericht zou al opgeslagen moeten zijn — stuur het zo opnieuw."
    replaced: "het sessiedatabasebestand is vervangen terwijl Hermes draaide, dus dit bericht is niet opgeslagen (een kopie staat in {home}/sessions/). Stop Hermes (`hermes {profile_arg}gateway stop`), voer `hermes {profile_arg}doctor` uit — niet `hermes {profile_arg}doctor --fix`, dat het verkeerde bestand ter plekke zou repareren — start Hermes dan opnieuw en stuur je bericht nog een keer. Geavanceerde herstelstappen staan in het logboek."
    deleted_wal: "een ander Hermes-proces heeft nog een oude kopie van het write-ahead log van de sessiedatabase vast, dus Hermes is gestopt met schrijven om het bestand veilig te houden en dit bericht is niet opgeslagen (een kopie staat in {home}/sessions/). Er gaat niets verloren. Sluit elk Hermes-proces op dit profiel af (Desktop-app, `hermes {profile_arg}gateway stop`, dashboard, cron), voer `hermes {profile_arg}doctor` uit — dat noemt elk proces dat het log nog vasthoudt — start Hermes dan opnieuw en stuur je bericht nog een keer. Voer geen `doctor --fix` uit en verwijder geen state.db-bestanden zolang die processen draaien. Handleiding: {recovery_docs}"
    corrupt: "de beurt is gestopt omdat de statusdatabase structurele corruptie meldde (het transcript zou bij een herstart verloren zijn gegaan). Schijfruimte vrijmaken helpt niet. Herstelopties:\n1. Voer `hermes {profile_arg}doctor --fix` uit\n2. Stop de gateway en herstel daarna met:\n   hermes {profile_arg}sessions recover --source {db_path} --inspect-only\n   (als dat herstelbaar meldt) hermes {profile_arg}sessions recover --source {db_path} --output recovered-state.db\n   — herstel maakt eerst een momentopname van het beschadigde bestand; voer GEEN `sqlite3 ... \".recover\"` uit op de actieve state.db, een kwetsbare sqlite3-CLI kan die verder beschadigen\n3. Zet een back-up terug uit {backups_dir}/\nStuur je bericht daarna opnieuw."
    fts_index: "de beurt is gestopt omdat de zoekindex van sessies (FTS5) corrupt is en niet kon worden losgekoppeld, dus dit bericht is niet opgeslagen. De berichtenopslag zelf is niet beschadigd: voer geen hersteltools uit en zet geen back-up terug. Voer `hermes {profile_arg}doctor --fix` uit (of herstart Hermes, dat de index bij het openen repareert) en stuur je bericht dan opnieuw."
    disk: "Hermes kon dit gesprek niet op schijf opslaan en is gestopt om je berichten niet kwijt te raken. De schijf is waarschijnlijk vol: maak ruimte vrij (of herstel de rechten op {home}/state.db) en stuur je bericht dan opnieuw."
    default: "Hermes kon dit gesprek niet opslaan en is gestopt om je berichten niet kwijt te raken. Mogelijke oorzaken: de schijf is vol, of een ander Hermes-proces houdt de database vast. Sluit andere Hermes-vensters, voer `hermes {profile_arg}doctor` uit om de opslag te controleren en stuur je bericht dan opnieuw."
  file_mutation:
    header: "⚠️ Controle van bestandswijzigingen: {count} bestandsbewerking(en) MISLUKT in deze beurt, ook al suggereert de tekst hierboven misschien iets anders. Voer `git status` of `read_file` uit om te controleren wat er echt is doorgevoerd."
    entry: "  • `{path}` — [{tool}] {preview}"
    failed: "mislukt"
  shared:
    and_more: "  • … en nog {count}"
    the_model: "Het model"
tips:
  t001: "/bg <prompt> voert een taak uit in een aparte sessie terwijl je huidige sessie vrij blijft; /btw <question> beantwoordt een zijvraag over dit gesprek zonder het te onderbreken."
  t002: "/branch splitst de huidige sessie af zodat je een andere richting kunt verkennen zonder voortgang te verliezen."
  t003: "/compress comprimeert de gesprekscontext handmatig als het lang wordt."
  t004: "/rollback toont herstelpunten van het bestandssysteem — zet bestanden die de agent heeft gewijzigd terug naar elke eerdere staat."
  t005: "/rollback diff 2 toont wat er sinds herstelpunt 2 is veranderd zonder iets terug te zetten."
  t006: "/rollback 2 src/file.py zet één bestand terug vanaf een specifiek herstelpunt."
  t007: "/title \"my project\" geeft je sessie een naam — hervat hem later met /resume of hermes -c."
  t008: "/resume gaat verder waar je gebleven was in een eerder benoemde sessie."
  t009: "/queue <prompt> zet een bericht in de wachtrij voor de volgende beurt zonder de huidige te onderbreken."
  t010: "/undo verwijdert de laatste uitwisseling tussen gebruiker en assistent uit het gesprek."
  t011: "/retry stuurt je laatste bericht opnieuw — handig als het antwoord van de agent niet helemaal goed was."
  t012: "/verbose wisselt de weergave van toolvoortgang: off → new → all → verbose."
  t013: "/reasoning high vergroot de denkdiepte van het model. /reasoning show toont de redenering."
  t014: "/fast schakelt prioriteitsverwerking in of uit voor snellere API-antwoorden (afhankelijk van aanbieder)."
  t015: "/yolo slaat alle goedkeuringsvragen voor gevaarlijke opdrachten over voor de rest van de sessie."
  t016: "/model laat je midden in een sessie van model wisselen — probeer /model sonnet of /model gpt-5."
  t017: "/model --global wijzigt je standaardmodel permanent."
  t018: "/personality pirate stelt een leuke persoonlijkheid in — 14 ingebouwde opties, van kawaii tot shakespeare."
  t019: "/skin wijzigt het CLI-thema — probeer ares, mono, slate, poseidon of charizard."
  t020: "/statusbar schakelt een vaste balk in of uit met model, tokens, contextvulling in %, kosten en duur."
  t021: "/tools disable browser verwijdert browsertools tijdelijk voor de huidige sessie."
  t022: "/browser connect koppelt browsertools via CDP aan je draaiende Chromium-browser."
  t023: "/plugins toont geïnstalleerde plug-ins en hun status."
  t024: "/cron beheert geplande taken — stel terugkerende prompts in met bezorging naar elk platform."
  t025: "/reload-mcp laadt de MCP-serverconfiguratie opnieuw zonder herstart."
  t026: "/usage toont tokengebruik, kostenoverzicht en sessieduur."
  t027: "/insights toont gebruiksanalyses van de afgelopen 30 dagen."
  t028: "/paste zoekt een afbeelding op je klembord en voegt die toe aan je volgende bericht."
  t029: "/profile toont welk profiel actief is en de bijbehorende thuismap."
  t030: "/config toont je huidige configuratie in één oogopslag."
  t031: "/stop beëindigt alle achtergrondprocessen die de agent heeft gestart."
  t032: "@file:path/to/file.py voegt de inhoud van een bestand direct in je bericht in."
  t033: "@file:main.py:10-50 voegt alleen regels 10-50 van een bestand in."
  t034: "@folder:src/ voegt een overzicht van de mappenstructuur in."
  t035: "@diff voegt je niet-gestagede git-wijzigingen in het bericht in."
  t036: "@staged voegt je gestagede git-wijzigingen in (git diff --staged)."
  t037: "@git:5 voegt de laatste 5 commits met volledige patches in."
  t038: "@url:https://example.com haalt de inhoud van een webpagina op en voegt die in."
  t039: "Typ @ voor automatisch aanvullen van bestandspaden — navigeer interactief naar elk bestand."
  t040: "Combineer meerdere verwijzingen: \"Review @file:main.py and @file:test.py for consistency.\""
  t041: "Alt+Enter voegt een nieuwe regel in voor invoer over meerdere regels. (Windows Terminal onderschept Alt+Enter — gebruik dan Ctrl+Enter.)"
  t042: "Ctrl+C onderbreekt de agent. Druk binnen 2 seconden nog eens om geforceerd af te sluiten."
  t043: "Ctrl+Z zet Hermes in de achtergrond — voer fg uit in je shell om verder te gaan."
  t044: "Tab accepteert de grijze suggestietekst of vult slash-opdrachten automatisch aan."
  t045: "Typ een nieuw bericht terwijl de agent bezig is om hem te onderbreken en bij te sturen."
  t046: "Alt+V plakt een afbeelding van je klembord in het gesprek."
  t047: "Als je 5 of meer regels plakt, wordt dat automatisch in een bestand opgeslagen en wordt er een compacte verwijzing ingevoegd."
  t048: "hermes -c hervat je meest recente CLI-sessie. hermes -c \"project name\" hervat op titel."
  t049: "hermes -w maakt een geïsoleerde git-worktree — ideaal voor parallelle agentworkflows."
  t050: "hermes -w -q \"Fix issue #42\" combineert worktree-isolatie met een eenmalige vraag."
  t051: "hermes chat -t web,terminal schakelt alleen specifieke toolsets in voor een gerichte sessie."
  t052: "hermes chat -s github-pr-workflow laadt bij het starten vooraf een skill."
  t053: "hermes chat -q \"query\" voert één niet-interactieve vraag uit en sluit dan af."
  t054: "hermes chat --max-turns 1000 overschrijft de standaardlimiet van 500 iteraties per beurt."
  t055: "hermes chat --checkpoints maakt momentopnamen van het bestandssysteem vóór elke destructieve bestandswijziging."
  t056: "hermes --yolo slaat alle goedkeuringsvragen voor gevaarlijke opdrachten over voor de hele sessie."
  t057: "hermes chat --source telegram labelt de sessie om te filteren in hermes sessions list."
  t058: "hermes -p work chat draait onder een specifiek profiel zonder je standaard te wijzigen."
  t059: "hermes doctor --fix stelt een diagnose en repareert automatisch configuratie- en afhankelijkheidsproblemen."
  t060: "hermes dump geeft een compact overzicht van je installatie — ideaal voor bugmeldingen."
  t061: "hermes config set KEY VALUE stuurt geheimen automatisch naar .env en al het andere naar config.yaml."
  t062: "hermes config edit opent config.yaml in je standaardeditor."
  t063: "hermes config check zoekt naar ontbrekende of verouderde configuratieopties."
  t064: "hermes sessions browse opent een interactieve sessiekiezer met zoekfunctie."
  t065: "hermes sessions stats toont het aantal sessies per platform en de databasegrootte."
  t066: "hermes sessions prune --older-than 30 ruimt oude sessies op."
  t067: "hermes skills search react --source skills-sh doorzoekt de openbare skills.sh-catalogus."
  t068: "hermes skills check controleert geïnstalleerde hub-skills op upstream-updates."
  t069: "hermes skills tap add myorg/skills-repo voegt een eigen GitHub-bron voor skills toe."
  t070: "hermes skills snapshot export setup.json exporteert je skillconfiguratie als back-up of om te delen."
  t071: "hermes mcp add github --command npx voegt MCP-servers toe vanaf de opdrachtregel."
  t072: "hermes mcp serve draait Hermes zelf als MCP-server voor andere agents."
  t073: "Met hermes auth add voeg je meerdere API-sleutels toe voor rotatie binnen een credential-pool."
  t074: "hermes completion bash >> ~/.bashrc schakelt tabaanvulling in voor alle opdrachten en profielen."
  t075: "hermes logs -f volgt agent.log live. --level WARNING --since 1h filtert de uitvoer."
  t076: "hermes backup maakt een zip-back-up van je volledige Hermes-thuismap."
  t077: "hermes profile create coder maakt een geïsoleerd profiel dat een eigen opdracht wordt."
  t078: "hermes profile create work --clone kopieert je huidige configuratie en sleutels naar een nieuw profiel."
  t079: "hermes update synchroniseert nieuwe meegeleverde skills automatisch naar ALLE profielen."
  t080: "hermes gateway install installeert Hermes als systeemdienst (systemd/launchd)."
  t081: "Met hermes memory setup stel je een externe geheugenaanbieder in (Honcho, Mem0, enz.)."
  t082: "hermes webhook subscribe maakt gebeurtenisgestuurde webhookroutes met HMAC-validatie."
  t083: "Bespaar geld: hermes tools schakelt ongebruikte tools uit, hermes skills config dunt skills uit."
  t084: "/reasoning low of /reasoning minimal verlaagt de denkdiepte onder de standaard (medium) — snellere, goedkopere antwoorden."
  t085: "hermes models stuurt vision-, compressie- en hulptaken naar goedkopere modellen — verlaagt de tokenkosten op de achtergrond met 85%+ zonder je hoofdmodel te verlagen."
  t086: "Zet display.bell_on_complete: true in config.yaml om een bel te horen als lange taken klaar zijn."
  t087: "Zet display.streaming: true om tokens live te zien verschijnen terwijl het model genereert."
  t088: "Zet display.show_reasoning: true om de chain-of-thought-redenering van het model te volgen."
  t089: "Zet display.compact: true om witruimte in de uitvoer te beperken voor compactere informatie."
  t090: "Zet display.busy_input_mode: queue om berichten in de wachtrij te zetten in plaats van de agent te onderbreken, of steer om ze tijdens de run in te voegen via /steer."
  t091: "Zet display.resume_display: minimal om de volledige gespreksamenvatting over te slaan bij het hervatten van een sessie."
  t092: "Zet compression.threshold: 0.50 om te bepalen wanneer automatische compressie start (standaard: 50% van de context)."
  t093: "Zet agent.max_turns: 1000 zodat de agent meer toolstappen per beurt kan zetten."
  t094: "Zet file_read_max_chars: 200000 om de maximale inhoud per read_file-aanroep te verhogen."
  t095: "Zet approvals.mode: smart om een LLM veilige opdrachten automatisch te laten goedkeuren en gevaarlijke automatisch te laten weigeren."
  t096: "Stel fallback_model in config.yaml in om automatisch over te schakelen naar een reserve-aanbieder."
  t097: "Zet privacy.redact_pii: true om gebruikers-ID's en telefoonnummers te hashen voordat ze naar de LLM gaan."
  t098: "Zet browser.record_sessions: true om browsersessies automatisch als WebM-video op te nemen."
  t099: "Zet worktree: true in config.yaml om altijd een git-worktree te maken (zelfde als hermes -w)."
  t100: "Zet security.website_blocklist.enabled: true om specifieke domeinen te blokkeren voor webtools."
  t101: "Zet cron.wrap_response: false om ruwe agentuitvoer te leveren zonder cron-kop- en voettekst."
  t102: "HERMES_TIMEZONE overschrijft de tijdzone van de server met elke IANA-tijdzonestring."
  t103: "Omgevingsvariabelen vervangen werkt in config.yaml: gebruik de syntaxis ${VAR_NAME}."
  t104: "Snelle opdrachten in config.yaml voeren shellopdrachten direct uit zonder tokenverbruik."
  t105: "Eigen persoonlijkheden kun je definiëren in config.yaml onder agent.personalities."
  t106: "provider_routing regelt het sorteren, toestaan en blokkeren van OpenRouter-aanbieders."
  t107: "execute_code draait Python-scripts die Hermes-tools programmatisch aanroepen — resultaten blijven buiten de context."
  t108: "delegate_task start standaard tot 10 gelijktijdige subagents (delegation.max_concurrent_children) met geïsoleerde contexten voor parallel werk."
  t109: "web_extract werkt met PDF-URL's — geef een PDF-link op en die wordt omgezet naar markdown."
  t110: "search_files draait op ripgrep en is sneller dan grep — gebruik het in plaats van grep in de terminal."
  t111: "patch gebruikt 9 fuzzy-matchingstrategieën, zodat kleine verschillen in witruimte bewerkingen niet breken."
  t112: "patch ondersteunt het V4A-formaat voor bulkbewerkingen over meerdere bestanden in één aanroep."
  t113: "read_file stelt vergelijkbare bestandsnamen voor als een bestand niet wordt gevonden."
  t114: "read_file ontdubbelt automatisch — een ongewijzigd bestand opnieuw lezen geeft een lichte stub terug."
  t115: "browser_vision maakt een screenshot en analyseert die met AI — werkt voor CAPTCHA's en visuele inhoud."
  t116: "browser_console kan JavaScript-expressies evalueren in de context van de pagina."
  t117: "image_generate maakt afbeeldingen met FLUX 2 Pro en automatische 2x-upscaling."
  t118: "text_to_speech zet tekst om in audio — wordt op Telegram afgespeeld als spraakbericht."
  t119: "send_message kan vanuit een sessie elk gekoppeld berichtenplatform bereiken."
  t120: "De todo-tool helpt de agent complexe taken met meerdere stappen bij te houden tijdens een sessie."
  t121: "session_search doorzoekt de volledige tekst van ALLE eerdere gesprekken."
  t122: "De agent slaat voorkeuren, correcties en feiten over de omgeving automatisch op in het geheugen."
  t123: "/moa stuurt één moeilijke prompt door je ingestelde Mixture of Agents-modelset."
  t124: "Terminalopdrachten ondersteunen een achtergrondmodus met notify_on_complete voor langlopende taken."
  t125: "Achtergrondprocessen in de terminal ondersteunen watch_patterns om te waarschuwen bij specifieke uitvoerregels."
  t126: "De terminaltool ondersteunt 6 backends: local, Docker, SSH, Modal, Daytona en Singularity."
  t127: "Elk profiel heeft een eigen configuratie, API-sleutels, geheugen, sessies, skills en cronjobs."
  t128: "Profielnamen worden shellopdrachten — 'hermes profile create coder' maakt de opdracht 'coder'."
  t129: "hermes profile export coder -o backup.tar.gz maakt een overdraagbaar profielarchief."
  t130: "Als twee profielen per ongeluk een bottoken delen, wordt de tweede gateway geblokkeerd met een duidelijke foutmelding."
  t131: "Sessies krijgen na de eerste uitwisseling automatisch een beschrijvende titel — zelf een naam geven is niet nodig."
  t132: "Sessietitels ondersteunen afstamming: \"my project\" → \"my project #2\" → \"my project #3\"."
  t133: "Bij het afsluiten toont Hermes een hervatopdracht met sessie-ID en statistieken."
  t134: "hermes sessions export backup.jsonl exporteert alle sessies voor back-up of analyse."
  t135: "hermes -r SESSION_ID hervat elke specifieke eerdere sessie via de ID."
  t136: "Geheugen is een bevroren momentopname — wijzigingen verschijnen pas bij de volgende sessiestart in de systeemprompt."
  t137: "Geheugenitems worden automatisch gescand op promptinjectie- en exfiltratiepatronen."
  t138: "De agent heeft twee geheugenopslagen: persoonlijke notities (~2200 tekens) en gebruikersprofiel (~1375 tekens)."
  t139: "Correcties die je de agent geeft (\"nee, doe het zo\") worden vaak automatisch in het geheugen opgeslagen."
  t140: "Meer dan 80 meegeleverde skills voor github, creatief werk, mlops, productiviteit, onderzoek en meer."
  t141: "Elke geïnstalleerde skill wordt automatisch een slash-opdracht — typ / om ze allemaal te zien."
  t142: "hermes skills install official/security/1password installeert optionele skills uit de repo."
  t143: "Skills kunnen zich beperken tot specifieke besturingssystemen — sommige laden alleen op macOS of Linux."
  t144: "Met skills.external_dirs in config.yaml laad je skills uit eigen mappen."
  t145: "De agent kan met skill_manage eigen skills maken als procedureel geheugen."
  t146: "/plan schrijft een implementatieplan in markdown naar .hermes/plans/ zonder iets uit te voeren."
  t147: "Cronjobs kunnen skills koppelen: hermes cron add --skill blogwatcher \"Check for new posts\"."
  t148: "Bezorgdoelen voor cron zijn onder meer telegram, discord, slack, e-mail, sms en 12+ andere platforms."
  t149: "Als een cron-antwoord begint met [SILENT], wordt de bezorging onderdrukt — handig voor jobs die alleen monitoren."
  t150: "Cron ondersteunt relatieve vertragingen (30m), intervallen (every 2h), cron-expressies en ISO-tijdstempels."
  t151: "Cronjobs draaien in volledig nieuwe agentsessies — prompts moeten op zichzelf staan."
  t152: "Spraakmodus werkt zonder API-sleutels als faster-whisper is geïnstalleerd (gratis lokale spraak naar tekst)."
  t153: "Vijf TTS-aanbieders beschikbaar: Edge TTS (gratis), ElevenLabs, OpenAI, NeuTTS (gratis lokaal), MiniMax."
  t154: "/voice on schakelt spraakmodus in de CLI in. Ctrl+B schakelt push-to-talk-opname aan en uit."
  t155: "Streaming-TTS speelt zinnen af zodra ze gegenereerd zijn — je hoeft niet op het volledige antwoord te wachten."
  t156: "Spraakberichten op Telegram, Discord, WhatsApp en Slack worden automatisch getranscribeerd."
  t157: "Hermes draait op 21 berichtenplatforms: Telegram, Discord, Slack, WhatsApp, Signal, Matrix, IRC, Microsoft Teams, e-mail en meer."
  t158: "hermes gateway install installeert het als systeemdienst die bij het opstarten start."
  t159: "DingTalk gebruikt Stream Mode — geen webhooks of openbare URL nodig."
  t160: "BlueBubbles brengt iMessage naar Hermes via een lokale macOS-server."
  t161: "Webhookroutes ondersteunen HMAC-validatie, rate limiting en filteren op gebeurtenissen."
  t162: "De API-server biedt een OpenAI-compatibel endpoint dat werkt met Open WebUI en LibreChat."
  t163: "Discord-spraakkanaalmodus: de bot neemt deel aan het spraakkanaal, transcribeert spraak en praat terug."
  t164: "group_sessions_per_user: true geeft iedereen een eigen sessie in groepsgesprekken."
  t165: "/sethome markeert een gesprek als thuiskanaal voor bezorging van cronjobs."
  t166: "De gateway ondersteunt time-outs op basis van inactiviteit — actieve agents kunnen onbeperkt doorlopen."
  t167: "Goedkeuring van gevaarlijke opdrachten kent 4 niveaus: eenmalig, sessie, altijd (permanente toestaanlijst), weigeren."
  t168: "Slimme goedkeuringsmodus gebruikt een LLM om veilige opdrachten automatisch goed te keuren en gevaarlijke te markeren."
  t169: "SSRF-bescherming blokkeert privénetwerken, loopback-, link-local- en cloudmetadata-adressen."
  t170: "Tirith-scans vóór uitvoering detecteren homograaf-URL-spoofing en pipe-naar-interpreter-patronen."
  t171: "MCP-subprocessen krijgen een gefilterde omgeving — alleen veilige systeemvariabelen worden doorgegeven."
  t172: "Contextbestanden (.hermes.md, AGENTS.md) worden vóór het laden gescand op promptinjectie."
  t173: "command_allowlist in config.yaml keurt specifieke shellopdrachtpatronen permanent goed."
  t174: "De context wordt automatisch gecomprimeerd bij het bereiken van de drempel — herinneringen worden weggeschreven en de geschiedenis samengevat."
  t175: "De statusbalk wordt geel, dan oranje, dan rood naarmate de context volloopt."
  t176: "SOUL.md is het primaire identiteitsbestand van de agent — pas het aan om het gedrag te sturen."
  t177: "Hermes laadt projectcontext uit .hermes.md, AGENTS.md, CLAUDE.md of .cursorrules (eerste treffer)."
  t178: "AGENTS.md-bestanden in submappen worden geleidelijk ontdekt terwijl de agent mappen in navigeert."
  t179: "Contextbestanden zijn begrensd op 20.000 tekens met slimme inkorting van begin en eind."
  t180: "Vijf browseraanbieders: lokale Chromium, Browserbase, Browser Use, Camofox en Firecrawl."
  t181: "Camofox is een browser tegen detectie — een Firefox-fork met fingerprint-spoofing in C++."
  t182: "browser_navigate geeft automatisch een momentopname van de pagina terug — browser_snapshot daarna aanroepen is niet nodig."
  t183: "browser_vision met annotate=true legt genummerde labels over interactieve elementen."
  t184: "hermes mcp opent een interactieve kiezer met door Nous goedgekeurde MCP's die je met één toetsaanslag installeert."
  t185: "hermes mcp catalog toont de door Nous goedgekeurde MCP-servers die met de repo worden meegeleverd."
  t186: "hermes mcp install <name> installeert een catalogusitem, vraagt om inloggegevens en laat je kiezen welke tools je inschakelt."
  t187: "MCP-servers worden ingesteld in config.yaml — zowel stdio- als HTTP-transport wordt ondersteund."
  t188: "Toolfiltering per server: tools.include staat specifieke tools toe en tools.exclude blokkeert ze."
  t189: "MCP-servers genereren tijdens runtime automatisch toolsets — met hermes tools schakel je ze per platform in of uit."
  t190: "MCP-OAuth-ondersteuning: auth: oauth schakelt browsergebaseerde autorisatie met PKCE in."
  t191: "Herstelpunten kosten niets als er geen bestanden worden gewijzigd — standaard ingeschakeld."
  t192: "Vóór een rollback wordt automatisch een momentopname opgeslagen, zodat je het ongedaan maken ongedaan kunt maken."
  t193: "/rollback maakt ook de gespreksbeurt ongedaan, zodat de agent teruggedraaide wijzigingen niet onthoudt."
  t194: "Herstelpunten gebruiken schaduwrepo's in ~/.hermes/checkpoints/ — de .git van je project wordt nooit aangeraakt."
  t195: "batch_runner.py verwerkt honderden prompts parallel om trainingsdata te genereren."
  t196: "hermes chat -Q schakelt de stille modus in voor programmatisch gebruik — onderdrukt banner en spinner."
  t197: "Trajecten opslaan (--save-trajectories) legt volledige tooltraces vast voor modeltraining."
  t198: "Drie soorten plug-ins: algemeen (tools/hooks), geheugenaanbieders en contextengines."
  t199: "hermes plugins install owner/repo installeert plug-ins rechtstreeks vanaf GitHub."
  t200: "Externe geheugenaanbieders: Honcho, OpenViking en Mem0 meegeleverd; Hindsight en meer via hermes plugins install."
  t201: "Plug-inhooks zijn onder meer pre/post_tool_call, pre/post_llm_call en transform_terminal_output om uitvoer te normaliseren."
  t202: "Promptcaching (Anthropic) verlaagt de kosten door gecachete voorvoegsels van de systeemprompt te hergebruiken."
  t203: "De agent genereert sessietitels automatisch in een achtergrondthread — geen extra vertraging."
  t204: "Slimme modelroutering kan eenvoudige vragen automatisch naar een goedkoper model sturen."
  t205: "Slash-opdrachten ondersteunen prefixherkenning: /h wordt /help, /mod wordt /model."
  t206: "Een bestandspad naar de terminal slepen voegt afbeeldingen automatisch toe of stuurt het mee als context."
  t207: ".worktreeinclude in de root van je repo somt door git genegeerde bestanden op die naar worktrees worden gekopieerd."
  t208: "hermes acp draait Hermes als ACP-server voor integratie met VS Code, Zed en JetBrains."
  t209: "Eigen aanbieders: sla benoemde endpoints op in config.yaml onder custom_providers."
  t210: "HERMES_EPHEMERAL_SYSTEM_PROMPT voegt een systeemprompt in die nooit in de geschiedenis wordt bewaard."
  t211: "credential_pool_strategies ondersteunt rotatie via fill_first, round_robin, least_used en random."
  t212: "hermes auth add nous of hermes auth add openai-codex stelt aanbieders met OAuth in."
  t213: "De API-server ondersteunt zowel Chat Completions als de Responses API met status aan serverzijde."
  t214: "tool_preview_length: 0 in de configuratie toont volledige bestandspaden in de activiteitenfeed van de spinner."
  t215: "hermes status --deep voert diepere diagnostische controles uit op alle onderdelen."
  t216: "Cronjobs kunnen een Python-script koppelen (--script) waarvan de stdout als context in de prompt wordt ingevoegd."
  t217: "Cronscripts staan in ~/.hermes/scripts/ en draaien vóór de agent — ideaal voor pijplijnen voor gegevensverzameling."
  t218: "prefill_messages_file in config.yaml voegt few-shot-voorbeelden in elke API-aanroep in, zonder ze in de geschiedenis op te slaan."
  t219: "SOUL.md vervangt de standaardidentiteit van de agent volledig — herschrijf het om Hermes helemaal eigen te maken."
  t220: "SOUL.md wordt bij de eerste start automatisch gevuld met een standaardpersoonlijkheid. Bewerk het om het aan te passen."
  t221: "/compress <focus topic> besteedt 60-70% van het samenvattingsbudget aan je onderwerp en kort de rest flink in."
  t222: "Bij een tweede of latere compressie werkt de compressor de vorige samenvatting bij in plaats van opnieuw te beginnen."
  t223: "Vóór een sessiereset in de gateway schrijft Hermes belangrijke feiten op de achtergrond automatisch naar het geheugen."
  t224: "network.force_ipv4: true in config.yaml verhelpt vastlopers op servers met kapotte IPv6 — past socket via monkey-patching aan."
  t225: "De terminaltool licht veelvoorkomende exitcodes toe: grep die 1 teruggeeft = 'No matches found (not an error)'."
  t226: "Mislukte terminalopdrachten op de voorgrond worden automatisch tot 3 keer opnieuw geprobeerd met exponentiële backoff (2s, 4s, 8s)."
  t227: "Kale sudo-opdrachten worden automatisch herschreven om SUDO_PASSWORD uit .env door te sluizen — geen interactieve prompt nodig."
  t228: "Helpers van execute_code vereisen expliciete imports: from hermes_tools import json_parse, shell_quote, retry."
  t229: "De 7 sandboxtools van execute_code (web_search, terminal, read/write/search/patch) gebruiken RPC — ze komen nooit in de context."
  t230: "Hetzelfde bestandsdeel 3+ keer lezen geeft een waarschuwing. Bij 4+ wordt het hard geblokkeerd om lussen te voorkomen."
  t231: "write_file en patch detecteren of een bestand sinds de laatste keer lezen extern is gewijzigd en waarschuwen voor verouderde inhoud."
  t232: "Het V4A-patchformaat ondersteunt de instructies Add File, Delete File en Move File — niet alleen Update."
  t233: "MCP-servers kunnen via sampling LLM-voltooiingen terugvragen — de agent wordt een tool voor de server."
  t234: "MCP-servers sturen notifications/tools/list_changed om tools automatisch opnieuw te registreren zonder herstart."
  t235: "delegate_task met acp_command: 'claude' start Claude Code als child-agent vanaf elk platform."
  t236: "Delegatie heeft een heartbeat-thread — activiteit van child-agents wordt doorgegeven aan de parent, wat gateway-time-outs voorkomt."
  t237: "Als een aanbieder HTTP 402 (betaling vereist) teruggeeft, schakelt de hulpclient automatisch over naar de volgende."
  t238: "agent.tool_use_enforcement stuurt modellen bij die acties beschrijven in plaats van tools aan te roepen — automatisch voor GPT/Codex."
  t239: "agent.restart_after_turn_timeout laat lopende beurten afronden voordat /restart stop() ingaat; restart_drain_timeout is alleen het budget voor geforceerd onderbreken zodra stop() begint."
  t240: "agent.api_max_retries (standaard 3) bepaalt hoe vaak de agent een mislukte API-aanroep opnieuw probeert voordat de fout wordt getoond — verlaag het voor een snelle fallback."
  t241: "De gateway cachet AIAgent-instanties per sessie — deze cache wissen breekt de promptcaching van Anthropic."
  t242: "Elke website kan skills aanbieden via /.well-known/skills/index.json — de skills-hub ontdekt ze automatisch."
  t243: "Het auditlog voor skills in ~/.hermes/skills/.hub/audit.log registreert elke installatie en verwijdering."
  t244: "Verouderde git-worktrees worden bij het opstarten automatisch opgeruimd: schone, volledig gemergede trees worden verwijderd; werk met wijzigingen of dat niet is gepusht blijft altijd bewaard."
  t245: "Profielen bakenen de Hermes-status af via HERMES_HOME; subprocessen van hosttools behouden je echte HOME, tenzij terminal.home_mode op profile staat."
  t246: "De omgevingsvariabele HERMES_HOME_MODE (octaal, bijv. 0701) stelt eigen maprechten in zodat een webserver erdoor kan."
  t247: "Containermodus: plaats .container-mode in HERMES_HOME en de host-CLI voert zich automatisch uit in de container."
  t248: "Ctrl+C kent 5 prioriteitsniveaus: opname annuleren → prompts annuleren → kiezer annuleren → agent onderbreken → afsluiten."
  t249: "Elke onderbreking tijdens een agentrun wordt met tijdstempels gelogd in ~/.hermes/interrupt_debug.log."
  t250: "BROWSER_CDP_URL verbindt browsertools met elke draaiende browser uit de Chromium-familie — accepteert WebSocket, HTTP of host:port."
  t251: "BROWSERBASE_ADVANCED_STEALTH=true schakelt geavanceerde bescherming tegen detectie in met aangepaste Chromium (Scale Plan)."
  t252: "De CLI schakelt automatisch over naar compacte modus in terminals smaller dan 80 kolommen."
  t253: "Snelle opdrachten zijn er in twee soorten: exec (voert een shellopdracht direct uit) en alias (verwijst door naar een andere opdracht)."
  t254: "Delegatiemodel per taak: delegation.model en delegation.provider in de configuratie sturen subagents naar goedkopere modellen."
  t255: "delegation.reasoning_effort regelt de denkdiepte van subagents afzonderlijk."
  t256: "display.platforms in config.yaml maakt weergave-instellingen per platform mogelijk: {telegram: {tool_progress: all}}."
  t257: "human_delay.mode in de configuratie simuleert menselijke typsnelheid — met instelbaar min_ms/max_ms-bereik."
  t258: "Migraties van de configuratieversie draaien automatisch bij het laden — nieuwe configuratiesleutels verschijnen zonder handmatig ingrijpen."
  t259: "GPT- en Codex-modellen krijgen speciale aanwijzingen in de systeemprompt voor tooldiscipline en verplicht toolgebruik."
  t260: "Gemini-modellen krijgen aangepaste instructies voor absolute paden, parallelle toolaanroepen en niet-interactieve opdrachten."
  t261: "context.engine in config.yaml kan op een plug-innaam worden gezet voor alternatieve strategieën voor contextbeheer."
  t262: "Momentopnamen van browserpagina's boven 15.000 tekens worden ingekort of automatisch samengevat; de volledige momentopname wordt opgeslagen in cache/web om met read_file door te bladeren."
  t263: "De compressor doet een goedkope voorronde: tooluitvoer van meer dan 200 tekens wordt vervangen door plaatshouders voordat de LLM draait."
  t264: "Als compressie mislukt, worden verdere pogingen 10 minuten gepauzeerd om de API niet te overbelasten."
  t265: "Lange gevaarlijke opdrachten (>70 tekens) krijgen een optie 'view' in de goedkeuringsprompt om eerst de volledige tekst te zien."
  t266: "Een audioniveauweergave toont ▁▂▃▄▅▆▇-balken tijdens spraakopname op basis van het RMS-niveau van de microfoon."
  t267: "Profielnamen mogen niet botsen met bestaande programma's in PATH — 'hermes profile create ls' wordt geweigerd."
  t268: "hermes profile create backup --clone-all kopieert alles (configuratie, sleutels, SOUL.md, herinneringen, skills, sessies)."
  t269: "De opnametoets voor spraak is instelbaar via voice.record_key in config.yaml — niet alleen Ctrl+B."
  t270: ".cursorrules- en .cursor/rules/*.mdc-bestanden worden automatisch herkend en als projectcontext geladen."
  t271: "Contextbestanden worden gecontroleerd op 10+ promptinjectiepatronen — onzichtbare Unicode, 'ignore instructions', exfiltratiepogingen."
  t272: "GPT-5 en Codex gebruiken de rol 'developer' in plaats van 'system' in het berichtformaat."
  t273: "Hulpinstellingen per taak: auxiliary.vision.provider, auxiliary.compression.model, enz. in config.yaml."
  t274: "De hulpclient behandelt 'main' als aanbiederalias — dit verwijst naar je eigenlijke primaire aanbieder + model."
  t275: "hermes claw migrate --dry-run toont een voorbeeld van de OpenClaw-migratie zonder iets te schrijven."
  t276: "Bestandspaden die met aanhalingstekens of escaped spaties worden geplakt, worden automatisch verwerkt — handmatig opschonen is niet nodig."
  t277: "Slash-opdrachten activeren nooit het inklappen van grote plakacties — /command met grote argumenten werkt correct."
  t278: "In onderbreekmodus omzeilen slash-opdrachten die je tijdens de uitvoering van de agent typt de onderbreeklogica en worden ze direct uitgevoerd."
  t279: "HERMES_DEV=1 slaat de detectie van containermodus over voor lokale ontwikkeling."
  t280: "Elke MCP-server krijgt een eigen toolset (mcp-servername) die je los kunt in- of uitschakelen via hermes tools."
  t281: "MCP-plaatshouders ${ENV_VAR} in de configuratie worden opgelost bij het starten van de server — inclusief variabelen uit ~/.hermes/.env."
  t282: "Skills uit vertrouwde repo's (NousResearch) krijgen beveiligingsniveau 'trusted'; community-skills worden extra gescand."
  t283: "De skills-quarantaine in ~/.hermes/skills/.hub/quarantine/ bevat skills die op een beveiligingscontrole wachten."
  t284: "/steer <prompt> voegt na de volgende toolaanroep een notitie in — stuur halverwege een taak bij zonder te onderbreken."
  t285: "/goal <text> stelt een blijvend Ralph-loop-doel in — Hermes gaat beurt na beurt automatisch door tot een beoordelaar zegt dat het klaar is."
  t286: "/snapshot create [label] slaat een volledige momentopname van de Hermes-configuratie op; /snapshot restore <id> zet die later terug."
  t287: "/copy [N] kopieert het laatste antwoord van de assistent naar je klembord, of met een getal het N-de vanaf het einde."
  t288: "/redraw tekent de hele UI opnieuw en herstelt terminalverschuivingen na een tmux-resize of restanten van muisselectie."
  t289: "/agents (alias /tasks) toont actieve agents en lopende achtergrondtaken in de huidige sessie."
  t290: "/footer schakelt de gateway-voettekst bij eindantwoorden in of uit, met model, context-% en cwd."
  t291: "/busy queue|steer|interrupt bepaalt wat Enter doet terwijl Hermes bezig is."
  t292: "/topic in Telegram-DM's zet de onderwerpmodus met meerdere door de gebruiker beheerde sessies aan — /topic <id> herstelt eerdere sessies inline."
  t293: "/approve session|always voert een wachtende gevaarlijke opdracht uit met het vertrouwensbereik dat je kiest; /deny weigert die."
  t294: "/restart herstart de gateway netjes nadat actieve runs zijn afgerond en stuurt de aanvrager een bericht zodra hij weer draait."
  t295: "/kanban boards switch <slug> wisselt vanuit het gesprek van actief Kanban-bord voor meerdere projecten."
  t296: "/reload laadt ~/.hermes/.env opnieuw in de lopende sessie — gebruik nieuwe API-sleutels zonder te herstarten."
  t297: "Een cronjob met no_agent=True voert volgens planning een script uit en verstuurt de stdout direct — nul tokens, geen LLM."
  t298: "Een lege stdout van een cronscript betekent een stille tick — er wordt niets afgeleverd, ideaal voor drempelbewaking."
  t299: "HERMES_CRON_MAX_PARALLEL (standaard 4) beperkt hoeveel cronjobs per tick draaien, zodat pieken je sleutels niet overbelasten."
  t300: "Gateway-hooks staan in ~/.hermes/hooks/<name>/ met HOOK.yaml + handler.py — de handler moet `handle` heten."
  t301: "Hook-events zijn onder meer gateway:startup, session:start, agent:step en wildcard-abonnementen op command:*."
  t302: "Zet een checklist in ~/.hermes/BOOT.md en een gateway:startup-hook voert die bij elke start uit als eenmalige agent."
  t303: "hermes curator run --dry-run toont vooraf wat de curator zou archiveren of samenvoegen, zonder iets te wijzigen."
  t304: "hermes curator pin <skill> schermt een skill volledig af tegen automatisch archiveren én de skill_manage-tool van de agent."
  t305: "hermes curator rollback herstelt skills uit een momentopname van vóór de run — back-ups staan in skills/.curator_backups/."
  t306: "hermes auth reset <provider> [target] wist afkoelperiodes en uitputtingsvlaggen van een hele credential-pool, of van één credential op index, id of label."
  t307: "credential_pool_strategies.<provider>: round_robin wisselt sleutels gelijkmatig af in plaats van de standaard fill_first."
  t308: "use_gateway: true per tool stuurt web, image, tts of browser via je Nous-abonnement — geen extra sleutels nodig."
  t309: "provider_routing.data_collection: deny sluit aanbieders die data opslaan uit op OpenRouter."
  t310: "provider_routing.require_parameters: true routeert alleen naar aanbieders die elke parameter in je verzoek ondersteunen."
  t311: "HERMES_TUI_RESUME=1 koppelt bij het starten automatisch opnieuw aan de meest recente TUI-sessie — handig na een weggevallen SSH-verbinding."
  t312: "HERMES_TUI_THEME=light|dark|<hex> dwingt het TUI-thema af op terminals die COLORFGBG niet instellen."
  t313: "Ctrl+G of Ctrl+X Ctrl+E in de TUI opent de invoerbuffer in $EDITOR voor lange prompts met meerdere regels."
  t314: "De TUI geeft LaTeX inline weer — $E=mc^2$ wordt Unicode-wiskunde in plaats van ruwe TeX."
  t315: "hermes dashboard start een lokale web-UI op 127.0.0.1:9119 — er verlaat geen data localhost."
  t316: "hermes dashboard toont de volledige Hermes-TUI in je browser via xterm.js en een WebSocket-PTY."
  t317: "Zet een YAML-bestand met twee paletkleuren in ~/.hermes/dashboard-themes/ om het hele dashboard een nieuw uiterlijk te geven."
  t318: "Dashboard-plug-ins werken direct: manifest.json + JS-bundel in ~/.hermes/dashboard-plugins/ — geen npm-build nodig."
  t319: "layoutVariant: cockpit in een dashboardthema voegt links een balk van 260px toe die plug-ins via het sidebar-slot kunnen vullen."
  t320: "display.tool_progress_command: true maakt /verbose beschikbaar op berichtenplatforms; standaard is het alleen voor de CLI."
  t321: "HERMES_BACKGROUND_NOTIFICATIONS=result meldt alleen wanneer achtergrondtaken klaar zijn (vs concise/all/error/off)."
  t322: "HERMES_WRITE_SAFE_ROOT beperkt write_file/patch tot mapvoorvoegsels; meerdere paden via os.pathsep (: of ;)."
  t323: "HERMES_IGNORE_RULES slaat het automatisch invoegen van AGENTS.md, SOUL.md, .cursorrules, geheugen en vooraf geladen skills over."
  t324: "HERMES_ACCEPT_HOOKS keurt nog niet geziene shell-hooks uit config.yaml automatisch goed, zonder TTY-prompt."
  t325: "auxiliary.goal_judge.model stuurt de /goal-beoordelaar naar een goedkoop, snel model om de loopkosten bijna nul te houden."
  t326: "Herstelpunten slaan mappen met meer dan 50.000 bestanden over om trage git-bewerkingen op enorme monorepo's te voorkomen."
  t327: "tts.provider: piper draait lokale TTS in 44 talen op de CPU — stemmen worden automatisch gedownload naar ~/.hermes/cache/piper-voices/."
  t328: "tts.providers.<name>.type: command koppelt elke CLI-TTS-engine met de placeholders {input_path} en {output_path}."
  t329: "API_SERVER_ENABLED=true draait naast de gateway een OpenAI-compatibel endpoint voor Open WebUI en LibreChat."
  t330: "GATEWAY_PROXY_URL maakt een gesplitste opzet: platform-I/O lokaal, agentwerk uitbesteed aan een externe API-server."
  t331: "MATRIX_DEVICE_ID legt een vaste apparaat-ID vast voor E2EE — zonder die ID wisselen de sleutels bij elke start en mislukt het ontsleutelen van oude berichten."
  t332: "TELEGRAM_WEBHOOK_SECRET is verplicht zodra TELEGRAM_WEBHOOK_URL is ingesteld — genereer het met openssl rand -hex 32."
  t333: "batch_runner.py --resume herkent voltooide prompts aan hun tekst, zodat een andere volgorde in de dataset afgerond werk niet opnieuw uitvoert."
  t334: "/new start ter plekke een nieuwe sessie (alias /reset) — nieuwe sessie-ID, schone geschiedenis, de CLI blijft open."
  t335: "/clear wist het terminalscherm EN start een nieuwe sessie — één sneltoets voor een visuele reset."
  t336: "/history toont het huidige gesprek inline zonder de CLI te verlaten — handig om snel iets terug te lezen."
  t337: "/save schrijft het huidige gesprek naar schijf zonder de sessie te beëindigen."
  t338: "/status toont sessie-info in één oogopslag: ID, titel, model, tokengebruik en verstreken tijd."
  t339: "/image <path> voegt een lokale afbeelding toe aan je volgende prompt, zonder plakken of slepen."
  t340: "/platforms toont vanuit het gesprek de verbindingsstatus van de gateway en berichtenplatforms."
  t341: "/commands toont de volledige lijst van slash-opdrachten en geïnstalleerde skills per pagina — handig op platforms zonder tab-aanvulling."
  t342: "/toolsets toont alle beschikbare toolsets, zodat je weet wat -t/--toolsets accepteert."
  t343: "/voice tts schakelt de modus met alleen tekst naar spraak in of uit — de agent antwoordt hardop, maar je typt je prompts nog steeds."
  t344: "/reload-skills scant ~/.hermes/skills/ opnieuw, zodat toegevoegde skills verschijnen zonder de sessie te herstarten."
  t345: "/indicator kaomoji|emoji|unicode|ascii kiest de stijl van de bezig-indicator in de TUI tijdens agent-runs."
  t346: "/debug uploadt een ondersteuningsbundel (systeeminfo + logs) en geeft deelbare links terug — werkt ook in gesprekken."
  t347: "hermes -z \"<prompt>\" is de zuiverste eenmalige aanroep: alleen het eindantwoord op stdout, verder niets — ideaal om in scripts door te sluizen."
  t348: "hermes chat --pass-session-id voegt de sessie-ID toe aan de systeemprompt, zodat de agent ernaar kan verwijzen."
  t349: "hermes chat --image path/to/pic.png voegt een lokale afbeelding toe aan één -q-vraag, zonder aparte uploadstap."
  t350: "hermes chat --ignore-user-config slaat de actieve gebruikersconfiguratie over — voor reproduceerbare bugmeldingen en CI-runs."
  t351: "hermes chat --source tool labelt programmatische gesprekken, zodat ze hermes sessions list niet vervuilen."
  t352: "hermes dump --show-keys bevat gemaskeerde vingerafdrukken van API-sleutels voor diepgaandere ondersteuning bij debuggen."
  t353: "hermes sessions rename <ID> \"new title\" hernoemt elke eerdere sessie; hermes sessions delete <ID> verwijdert er een."
  t354: "hermes import herstelt een volledige zip-back-up van Hermes; JSON/JSONL-exports van sessies importeer je via de pagina Sessions in het dashboard."
  t355: "hermes fallback beheert de fallback_model-keten interactief — config.yaml met de hand bewerken is niet nodig."
  t356: "hermes pairing vernieuwt het DM-koppeltoken — wie na het vernieuwen als eerste een bericht stuurt, krijgt toegang tot de bot."
  t357: "hermes setup loodst nieuwe gebruikers in één interactieve flow door het instellen van aanbieder, sleutels en platforms."
  t358: "hermes status --deep voert de volledige gezondheidscontrole uit over alle onderdelen; gewoon hermes status is het snelle overzicht."
  t359: "HERMES_AGENT_TIMEOUT=0 schakelt het afbreken bij inactiviteit door de gateway uit voor een lopende agent — gebruik dit voor lange onderzoeksruns."
  t360: "HERMES_ENABLE_PROJECT_PLUGINS=1 laadt automatisch repo-lokale plug-ins uit ./.hermes/plugins/ — bewust afhankelijk van vertrouwen."
  t361: "HERMES_DISABLE_FILE_STATE_GUARD=1 schakelt de controle 'bestand gewijzigd sinds je het las' uit voor patch en write_file."
  t362: "HERMES_ALLOW_PRIVATE_URLS=true laat webtools localhost en privénetwerken benaderen — standaard uit in gatewaymodus."
  t363: "HERMES_OPTIONAL_SKILLS=name1,name2 installeert bij de eerste start per profiel automatisch extra skills uit de optionele catalogus."
  t364: "HERMES_BUNDLED_SKILLS wijst naar een eigen map met meegeleverde skills — gebruikt door Homebrew- en Nix-pakketten."
  t365: "HERMES_DUMP_REQUEST_STDOUT=1 schrijft elke API-request-payload naar stdout in plaats van naar logbestanden."
  t366: "HERMES_OAUTH_TRACE=1 logt gemaskeerde OAuth-tokenuitwisselingen en vernieuwingspogingen om aanbiederauthenticatie te debuggen."
  t367: "HERMES_STREAM_RETRIES (standaard 3) bepaalt hoe vaak midden in een stream opnieuw verbinding wordt gemaakt bij tijdelijke netwerkfouten."
  t368: "HERMES_GATEWAY_BUSY_ACK_ENABLED=false onderdrukt de ⚡/⏳/⏩-bevestigingen wanneer een gebruiker een bezige agent een bericht stuurt."
  t369: "HERMES_AGENT_NOTIFY_INTERVAL (standaard 180s) bepaalt hoe vaak de gateway bij lange beurten een voortgangsmelding stuurt."
  t370: "HERMES_RESTART_DRAIN_TIMEOUT (standaard 900s) beperkt hoe lang /restart op lopende runs wacht voordat het doorzet."
  t371: "HERMES_CHECKPOINT_TIMEOUT (standaard 30s) beperkt het maken van herstelpunten op het bestandssysteem — verhoog dit bij enorme monorepo's."
  t372: "image_gen.model in config.yaml kiest het FAL-model: flux-2/klein, gpt-image-2, nano-banana-pro en meer."
  t373: "image_gen.provider stuurt het genereren van afbeeldingen via een plug-in (OpenAI Images, Codex, FAL) in plaats van de standaard."
  t374: "AUXILIARY_VISION_BASE_URL + AUXILIARY_VISION_API_KEY sturen beeldanalyse naar elk OpenAI-compatibel endpoint."
  t375: "security.tirith_fail_open: false laat Hermes opdrachten blokkeren wanneer de tirith-scanner zelf een fout geeft."
  t376: "De omgevingsvariabele TIRITH_FAIL_OPEN overschrijft de config tirith_fail_open — snel omschakelen zonder config.yaml te bewerken."
  t377: "Gesprekken met --source tool worden standaard uit hermes sessions list weggelaten — geef --source expliciet op om ze te zien."
  t378: "Sessie-ID's beginnen met een tijdstempel (20250305_091523_abcd), zodat sorteren in ls en jq vanzelf goed gaat."
  t379: "API_SERVER_MODEL_NAME past de modelnaam op /v1/models aan — essentieel voor Open WebUI-opstellingen met meerdere profielen."
  t380: "Dashboard-plug-ins worden geserveerd vanaf /dashboard-plugins/<name>/ — zet bestanden in ~/.hermes/dashboard-plugins/."
  placeholder:
    p01: "Vraag wat je wilt, of typ / voor opdrachten…"
    p02: "Vat samen wat er in deze map staat"
    p03: "Schrijf een conceptantwoord op de laatste e-mail in mijn inbox"
    p04: "Plan een functie en bouw die stap voor stap"
    p05: "Zoek en herstel een falende test"
    p06: "Onderzoek dit onderwerp en schrijf een korte samenvatting voor me"
    p07: "Wat is er recent veranderd in deze repo?"
    p08: "Maak van deze notities een takenlijst"
    p09: "Leg deze fout uit en hoe ik die oplos"
    p10: "Stel een herinnering in of plan een terugkerende taak"
